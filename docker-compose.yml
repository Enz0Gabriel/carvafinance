services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carva
      POSTGRES_PASSWORD: carva
      POSTGRES_DB: carvafinance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carva -d carvafinance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
